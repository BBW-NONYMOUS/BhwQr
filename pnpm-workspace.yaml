packages:
  - "apps/*"
  - "packages/*"

# Expo / React Native resolve packages through node_modules symlinks reliably only with a hoisted layout.
nodeLinker: hoisted
autoInstallPeers: true
strictPeerDependencies: false

onlyBuiltDependencies:
  - supabase
  - esbuild
  - sharp
  - unrs-resolver
  - "@tailwindcss/oxide"

